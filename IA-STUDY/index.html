<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IA de Estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="preview-stage">
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="background-glow glow-one"></div>
          <div class="background-glow glow-two"></div>

          <div class="app-shell mobile-shell">
            <header class="mobile-header">
              <div class="brand-mini">
                <span class="brand-mark">AI</span>
                <div>
                  <small>StudyFlow</small>
                  <strong>Hoje</strong>
                </div>
              </div>
              <button class="icon-button" type="button">+</button>
            </header>

            <nav class="mobile-tabs" aria-label="Navegação principal">
              <a class="tab active" href="index.html">Hoje</a>
              <a class="tab" href="materias.html">Matérias</a>
              <a class="tab" href="links.html">Links</a>
              <a class="tab" href="checklist.html">Checklist</a>
            </nav>

            <section class="hero-card">
              <div class="hero-topline">
                <span>Meta do dia</span>
                <strong id="dailyGoalLabel">120 min</strong>
              </div>
              <h1>Foco e organização para estudar melhor.</h1>
              <div class="progress-row">
                <span>Progresso</span>
                <strong id="progressPercent">0%</strong>
              </div>
              <small id="progressText">Nenhuma tarefa concluída ainda</small>
            </section>

            <section class="stats-row">
              <article class="mini-stat accent-stat">
                <span>Foco</span>
                <strong id="focusLabel">3 itens</strong>
              </article>
              <article class="mini-stat">
                <span>Resumo</span>
                <strong>2h</strong>
              </article>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3>Plano do dia</h3>
              </div>
              <ul id="planList" class="list-card compact-list"></ul>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3>Matérias</h3>
              </div>
              <div id="subjectCatalog" class="subject-chips"></div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <script src="shared.js"></script>
    <script src="app.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checklist | IA de Estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="preview-stage">
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="background-glow glow-one"></div>
          <div class="background-glow glow-two"></div>

          <div class="app-shell mobile-shell">
            <header class="mobile-header">
              <div class="brand-mini">
                <span class="brand-mark">AI</span>
                <div>
                  <small>StudyFlow</small>
                  <strong>Checklist</strong>
                </div>
              </div>
              <button class="icon-button" type="button">+</button>
            </header>

            <nav class="mobile-tabs" aria-label="Navegação principal">
              <a class="tab" href="index.html">Hoje</a>
              <a class="tab" href="materias.html">Matérias</a>
              <a class="tab" href="links.html">Links</a>
              <a class="tab active" href="checklist.html">Checklist</a>
            </nav>

            <section class="panel">
              <div class="panel-head">
                <h3>Adicionar tarefa</h3>
              </div>

              <form id="taskForm" class="form-stack">
                <label class="form-field">
                  Título da tarefa
                  <input type="text" id="taskTitle" placeholder="Ex: Revisar capítulo 3" required />
                </label>

                <div class="two-col">
                  <label class="form-field">
                    Prioridade
                    <select id="taskPriority">
                      <option value="alta">Alta</option>
                      <option value="média" selected>Média</option>
                      <option value="baixa">Baixa</option>
                    </select>
                  </label>
                  <label class="form-field">
                    Situação
                    <select id="taskDone">
                      <option value="false">Pendente</option>
                      <option value="true">Concluída</option>
                    </select>
                  </label>
                </div>

                <button type="submit" class="primary-button">Salvar tarefa</button>
              </form>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3>Lista de tarefas</h3>
                <strong id="taskCount" class="accent-text">0</strong>
              </div>
              <ul id="taskList" class="task-list"></ul>
            </section>
          </div>
        </div>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      const taskForm = document.getElementById('taskForm');
      const taskList = document.getElementById('taskList');
      const taskCount = document.getElementById('taskCount');

      function renderTasks() {
        const data = StudyFlow.getData();
        const tasks = data.tasks || [];

        taskCount.textContent = String(tasks.length);

        if (!tasks.length) {
          taskList.innerHTML = '<li class="empty-state"><strong>Nenhuma tarefa cadastrada</strong><span>Crie seu primeiro checklist para acompanhar o estudo.</span></li>';
          return;
        }

        taskList.innerHTML = tasks.map((task) => `
          <li>
            <strong>${task.title}</strong>
            <span>Prioridade: ${task.priority} • ${task.done ? 'Concluída' : 'Pendente'}</span>
          </li>
        `).join('');
      }

      taskForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const title = document.getElementById('taskTitle').value.trim();
        const priority = document.getElementById('taskPriority').value;
        const done = document.getElementById('taskDone').value === 'true';

        if (!title) return;

        const data = StudyFlow.getData();
        data.tasks.push({ id: Date.now(), title, priority, done });
        StudyFlow.saveData(data);
        taskForm.reset();
        renderTasks();
      });

      renderTasks();
    </script>
  </body>
</html>

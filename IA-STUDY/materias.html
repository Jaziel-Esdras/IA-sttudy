<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matérias | IA de Estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="preview-stage">
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="background-glow glow-one"></div>
          <div class="background-glow glow-two"></div>

          <div class="app-shell mobile-shell">
            <header class="mobile-header">
              <div class="brand-mini">
                <img class="brand-logo" src="logo-study-flow.png" alt="StudyFlow" />
                <div>
                  <small>StudyFlow</small>
                  <strong>Matérias</strong>
                </div>
              </div>
              <button class="icon-button" type="button">+</button>
            </header>

            <nav class="mobile-tabs" aria-label="Navegação principal">
              <a class="tab" href="index.html">Hoje</a>
              <a class="tab active" href="materias.html">Matérias</a>
              <a class="tab" href="links.html">Links</a>
              <a class="tab" href="checklist.html">Checklist</a>
            </nav>

            <section class="panel">
              <div class="panel-head">
                <h3>Adicionar matéria</h3>
              </div>

              <form id="topicForm" class="form-stack">
                <label class="form-field">
                  Nome da matéria
                  <input type="text" id="topicName" placeholder="Ex: Química" required />
                </label>

                <div class="two-col">
                  <label class="form-field">
                    Prioridade
                    <input type="number" id="topicPriority" min="1" max="5" value="3" required />
                  </label>
                  <label class="form-field">
                    Duração (min)
                    <input type="number" id="topicMinutes" min="10" value="45" required />
                  </label>
                </div>

                <label class="form-field">
                  Nível
                  <select id="topicDifficulty">
                    <option value="baixa">Baixa</option>
                    <option value="média" selected>Média</option>
                    <option value="alta">Alta</option>
                  </select>
                </label>

                <button type="submit" class="primary-button">Salvar matéria</button>
              </form>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3>Matérias</h3>
                <strong id="subjectCount" class="accent-text">0</strong>
              </div>
              <div id="subjectsGrid" class="subjects-grid"></div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      const topicForm = document.getElementById('topicForm');
      const subjectsGrid = document.getElementById('subjectsGrid');
      const subjectCount = document.getElementById('subjectCount');

      function renderSubjects() {
        const data = StudyFlow.getData();
        const topics = data.topics || [];

        subjectCount.textContent = String(topics.length);

        if (!topics.length) {
          subjectsGrid.innerHTML = '<div class="empty-state">Nenhuma matéria cadastrada. Adicione uma disciplina para começar.</div>';
          return;
        }

        subjectsGrid.innerHTML = topics.map((topic) => `
          <div class="subject-card">
            <h4>${topic.name}</h4>
            <span class="subject-meta">Prioridade ${topic.priority}</span>
            <span class="subject-meta">Tempo: ${topic.estimatedMinutes} min</span>
            <span class="subject-meta">Nível: ${topic.difficulty}</span>
            <a href="index.html">Acessar matéria</a>
          </div>
        `).join('');
      }

      topicForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const name = document.getElementById('topicName').value.trim();
        const priority = Number(document.getElementById('topicPriority').value || 1);
        const estimatedMinutes = Number(document.getElementById('topicMinutes').value || 30);
        const difficulty = document.getElementById('topicDifficulty').value;

        if (!name) return;

        const data = StudyFlow.getData();
        const newTopic = {
          id: Date.now(),
          name,
          priority,
          estimatedMinutes,
          difficulty,
          completed: false
        };

        data.topics.push(newTopic);
        StudyFlow.saveData(data);
        topicForm.reset();
        document.getElementById('topicPriority').value = 3;
        document.getElementById('topicMinutes').value = 45;
        renderSubjects();
      });

      renderSubjects();
    </script>
  </body>
</html>

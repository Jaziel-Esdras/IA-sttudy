<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todas as matérias | IA de Estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="preview-stage">
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="background-glow glow-one"></div>
          <div class="background-glow glow-two"></div>

          <div class="app-shell mobile-shell">
            <header class="mobile-header">
              <div class="brand-mini">
                <span class="brand-mark">AI</span>
                <div>
                  <small>StudyFlow</small>
                  <strong>Catalogo</strong>
                </div>
              </div>
              <button class="icon-button" type="button">+</button>
            </header>

            <nav class="mobile-tabs" aria-label="Navegação principal">
              <a class="tab" href="index.html">Hoje</a>
              <a class="tab active" href="todas-materias.html">Matérias</a>
              <a class="tab" href="links.html">Links</a>
              <a class="tab" href="checklist.html">Checklist</a>
            </nav>

            <section class="panel">
              <div class="panel-head">
                <h3>Lista completa</h3>
                <strong id="totalMaterias" class="accent-text">0</strong>
              </div>
              <div id="catalogGrid" class="subjects-grid"></div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      const catalogGrid = document.getElementById('catalogGrid');
      const totalMaterias = document.getElementById('totalMaterias');

      function renderCatalog() {
        const data = StudyFlow.getData();
        const topics = data.topics || [];

        totalMaterias.textContent = String(topics.length);

        if (!topics.length) {
          catalogGrid.innerHTML = '<div class="empty-state">Nenhuma matéria adicionada. Cadastre sua primeira disciplina na página de matérias.</div>';
          return;
        }

        catalogGrid.innerHTML = topics.map((topic) => `
          <div class="subject-card">
            <h4>${topic.name}</h4>
            <span class="subject-meta">Prioridade: ${topic.priority}</span>
            <span class="subject-meta">Duração: ${topic.estimatedMinutes} min</span>
            <span class="subject-meta">Nível: ${topic.difficulty}</span>
            <span class="subject-meta">Status: ${topic.completed ? 'Concluída' : 'Pendente'}</span>
            <a href="materias.html">Abrir</a>
          </div>
        `).join('');
      }

      renderCatalog();
    </script>
  </body>
</html>

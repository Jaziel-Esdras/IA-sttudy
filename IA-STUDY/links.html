<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links | IA de Estudos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="preview-stage">
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="background-glow glow-one"></div>
          <div class="background-glow glow-two"></div>

          <div class="app-shell mobile-shell">
            <header class="mobile-header">
              <div class="brand-mini">
                <img class="brand-logo" src="logo-study-flow.png" alt="StudyFlow" />
                <div>
                  <small>StudyFlow</small>
                  <strong>Links</strong>
                </div>
              </div>
              <button class="icon-button" type="button">+</button>
            </header>

            <nav class="mobile-tabs" aria-label="Navegação principal">
              <a class="tab" href="index.html">Hoje</a>
              <a class="tab" href="materias.html">Matérias</a>
              <a class="tab active" href="links.html">Links</a>
              <a class="tab" href="checklist.html">Checklist</a>
            </nav>

            <section class="panel">
              <div class="panel-head">
                <h3>Adicionar material</h3>
              </div>

              <form id="linkForm" class="form-stack">
                <label class="form-field">
                  Título
                  <input type="text" id="linkTitle" placeholder="Ex: Revisão de Álgebra" required />
                </label>

                <label class="form-field">
                  URL
                  <input type="url" id="linkUrl" placeholder="https://..." required />
                </label>

                <div class="two-col">
                  <label class="form-field">
                    Categoria
                    <input type="text" id="linkCategory" value="geral" />
                  </label>
                  <label class="form-field">
                    Tags
                    <input type="text" id="linkTags" placeholder="ex: revisão, vídeo" />
                  </label>
                </div>

                <button type="submit" class="secondary-button">Adicionar material</button>
              </form>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h3>Materiais salvos</h3>
                <strong id="linkCount" class="accent-text">0</strong>
              </div>
              <div id="linksSummary" class="resource-list"></div>
            </section>
          </div>
        </div>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      const linkForm = document.getElementById('linkForm');
      const linksSummary = document.getElementById('linksSummary');
      const linkCount = document.getElementById('linkCount');

      function summarizeLink(link) {
        const source = new URL(link.url).hostname.replace('www.', '');
        const tags = link.tags && link.tags.length ? link.tags.join(', ') : 'sem tags';
        const notes = link.notes && link.notes.length ? link.notes.join(' ') : 'Nenhum comentário adicional registrado.';
        return `Resumo do material: ${link.title} | categoria=${link.category} | fonte=${source} | tags=${tags} | principais ideias: ${notes}`;
      }

      function renderLinks() {
        const data = StudyFlow.getData();
        const links = data.links || [];

        linkCount.textContent = String(links.length);

        if (!links.length) {
          linksSummary.innerHTML = '<div class="empty-state">Nenhum material salvo ainda. Adicione um link para começar sua biblioteca.</div>';
          return;
        }

        linksSummary.innerHTML = links.map((link) => `
          <div class="summary-card resource-card">
            <strong>${link.title}</strong>
            <span class="meta">${link.category}</span>
            <p>${summarizeLink(link)}</p>
            <div class="tags">${(link.tags || []).map((tag) => `<span class="tag">${tag}</span>`).join('')}</div>
            <a href="${link.url}" target="_blank" rel="noreferrer">Abrir material</a>
          </div>
        `).join('');
      }

      linkForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const title = document.getElementById('linkTitle').value.trim();
        const url = document.getElementById('linkUrl').value.trim();
        const category = document.getElementById('linkCategory').value.trim() || 'geral';
        const tags = document.getElementById('linkTags').value.trim();

        if (!title || !url) return;

        const data = StudyFlow.getData();
        data.links.push({
          id: Date.now(),
          title,
          url,
          category,
          tags: tags ? tags.split(',').map((item) => item.trim()).filter(Boolean) : [],
          notes: ['Material de apoio adicionado para revisão.']
        });

        StudyFlow.saveData(data);
        linkForm.reset();
        document.getElementById('linkCategory').value = 'geral';
        renderLinks();
      });

      renderLinks();
    </script>
  </body>
</html>
